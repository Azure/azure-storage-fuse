<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blobfuse2 Engineering Performance</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
    :root { --ink:#17202a; --muted:#65717e; --paper:#f4f6f7; --panel:#fff; --line:#d7dee3; --blue:#0067b8; --green:#177245; --red:#b42318; --amber:#9a6700; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:'IBM Plex Sans',sans-serif; letter-spacing:0; }
    header { color:#fff; background:#17202a; border-bottom:5px solid #1ba784; }
    header .shell { display:flex; align-items:end; justify-content:space-between; gap:28px; padding-top:30px; padding-bottom:28px; }
    .shell { width:min(1320px,calc(100% - 36px)); margin:0 auto; }
    h1 { margin:0 0 6px; font-size:clamp(28px,4vw,44px); font-weight:600; }
    header p { margin:0; color:#bcc7cf; }
    .updated { color:#dce3e8; font:500 12px 'IBM Plex Mono',monospace; white-space:nowrap; }
    main { padding:24px 0 60px; }
    .filters { display:grid; grid-template-columns:repeat(6,minmax(130px,1fr)); gap:10px; margin-bottom:18px; }
    label { display:grid; gap:5px; color:var(--muted); font-size:11px; font-weight:600; text-transform:uppercase; }
    select { width:100%; height:40px; border:1px solid var(--line); border-radius:4px; padding:0 10px; color:var(--ink); background:var(--panel); font:inherit; }
    .summary { display:grid; grid-template-columns:220px 1fr 1fr; border:1px solid var(--line); border-radius:6px; background:var(--panel); overflow:hidden; }
    .status-panel { display:flex; flex-direction:column; justify-content:center; padding:24px; color:#fff; background:var(--blue); }
    .status-panel.regression { background:var(--red); } .status-panel.noisy { background:var(--amber); } .status-panel.improvement { background:var(--green); }
    .status-panel span { font-size:12px; text-transform:uppercase; opacity:.82; }
    .status-panel strong { margin-top:4px; font-size:28px; text-transform:uppercase; }
    .summary-metric { padding:22px 24px; border-left:1px solid var(--line); }
    .summary-metric span { color:var(--muted); font-size:12px; text-transform:uppercase; }
    .summary-metric strong { display:block; margin-top:6px; font:500 27px 'IBM Plex Mono',monospace; }
    .summary-metric small { color:var(--muted); }
    .chart-panel { margin-top:16px; padding:20px; border:1px solid var(--line); border-radius:6px; background:var(--panel); }
    .panel-title { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:16px; }
    .panel-title h2 { margin:0; font-size:20px; } .panel-title p { margin:0; color:var(--muted); font-size:13px; }
    canvas { display:block; width:100%; height:270px; }
    .table-panel { margin-top:16px; overflow:hidden; border:1px solid var(--line); border-radius:6px; background:var(--panel); }
    .table-panel .panel-title { padding:18px 20px 0; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; min-width:850px; }
    th,td { padding:13px 16px; border-top:1px solid var(--line); text-align:left; }
    th { color:var(--muted); background:#f7f9fa; font-size:11px; text-transform:uppercase; }
    td strong { display:block; } td small { color:var(--muted); }
    code { font-family:'IBM Plex Mono',monospace; }
    .pill { display:inline-block; padding:4px 7px; border-radius:3px; font-size:11px; font-weight:600; text-transform:uppercase; }
    .pill.stable { color:var(--blue); background:#e6f2fa; } .pill.regression { color:var(--red); background:#feeceb; }
    .pill.improvement { color:var(--green); background:#e7f4ec; } .pill.noisy { color:var(--amber); background:#fff4ce; }
    .empty { padding:48px; color:var(--muted); text-align:center; }
    @media (max-width:820px) { .shell { width:min(100% - 20px,1320px); } header .shell { align-items:start; flex-direction:column; } .filters { grid-template-columns:repeat(2,1fr); } .summary { grid-template-columns:1fr; } .summary-metric { border-left:0; border-top:1px solid var(--line); } }
  </style>
</head>
<body>
  <header><div class="shell"><div><h1>Engineering Performance</h1><p>Nightly Blobfuse2 regression signals across cache, account, architecture, and workload.</p></div><div class="updated" id="updated">Loading history...</div></div></header>
  <main class="shell">
    <section class="filters">
      <label>Suite<select id="suite"></select></label>
      <label>Architecture<select id="architecture"></select></label>
      <label>Account<select id="account"></select></label>
      <label>Cache<select id="cache"></select></label>
      <label>Compute profile<select id="compute"></select></label>
      <label>Workload<select id="workload"></select></label>
    </section>
    <div id="content"><div class="empty">Loading developer benchmark data...</div></div>
  </main>
  <script>
    const state = { runs: [], filters: {} };
    const colors = { line:'#0067b8', grid:'#d7dee3', text:'#65717e' };
    const titleCase = value => value.replaceAll('_',' ').replace(/\b\w/g, letter => letter.toUpperCase());
    const number = value => new Intl.NumberFormat('en-US',{ maximumFractionDigits:value >= 1000 ? 0 : 2 }).format(value);
    const metricUnit = name => ({throughput_mib_s:'MiB/s',iops:'IOPS',latency_p99_ms:'ms',sync_latency_p99_ms:'ms'})[name] || '';
    const computeProfile = run => run.run.compute_profile || run.environment?.compute_profile || run.environment?.vm_size || `${run.environment?.cpu_count ?? 'Unknown'} CPUs`;

    function unique(values) { return [...new Set(values)].filter(Boolean).sort(); }
    function setOptions(id, values, preferred) {
      const select=document.getElementById(id); select.innerHTML=values.map(value=>`<option value="${value}">${titleCase(value)}</option>`).join('');
      select.value=values.includes(preferred)?preferred:values[0]||''; state.filters[id]=select.value;
      select.onchange=event=>{state.filters[id]=event.target.value;if(['suite','architecture','account','cache'].includes(id))refreshCompute();if(id!=='workload')refreshWorkloads();render();};
    }
    function runsBeforeCompute() { return state.runs.filter(item=>item.run.suite===state.filters.suite&&item.run.architecture===state.filters.architecture&&item.run.account_type===state.filters.account&&item.run.cache_mode===state.filters.cache); }
    function refreshCompute(preferred='') { setOptions('compute',unique(runsBeforeCompute().map(computeProfile)),preferred); }
    function dimensionRuns() { return runsBeforeCompute().filter(item=>computeProfile(item)===state.filters.compute); }
    function benchmark(run,id) { return run?.benchmarks.find(item=>item.id===id); }
    function series() { return dimensionRuns().map(run=>({run,benchmark:benchmark(run,state.filters.workload)})).filter(item=>item.benchmark); }
    function rollingBaseline(items,index,metric) {
      const values=items.slice(Math.max(0,index-5),index).map(item=>item.benchmark.metrics[metric]?.median).filter(Number.isFinite);
      if(!values.length)return null; values.sort((a,b)=>a-b); return values[Math.floor(values.length/2)];
    }
    function assessment(items,index,metric,higherIsBetter) {
      const current=items[index].benchmark.metrics[metric]; const baseline=rollingBaseline(items,index,metric);
      if(!current||baseline===null)return {status:'stable',delta:null,baseline};
      const delta=(current.median/baseline-1)*100; const noise=current.median?current.mad/current.median*100:0; const threshold=Math.max(10,noise*3); const signed=higherIsBetter?delta:-delta;
      return {status:signed<=-threshold?'regression':signed>=threshold?'improvement':noise>10?'noisy':'stable',delta,baseline};
    }
    function refreshWorkloads() {
      const current=state.filters.workload; const workloads=unique(dimensionRuns().flatMap(run=>run.benchmarks.map(item=>item.id)));
      const select=document.getElementById('workload'); select.innerHTML=workloads.map(id=>`<option value="${id}">${benchmark(dimensionRuns().find(run=>benchmark(run,id)),id)?.name||titleCase(id)}</option>`).join('');
      select.value=workloads.includes(current)?current:workloads[0]||''; state.filters.workload=select.value; select.onchange=event=>{state.filters.workload=event.target.value;render();};
    }
    function draw(canvas,points) {
      const ratio=window.devicePixelRatio||1,width=Math.max(canvas.clientWidth,300),height=270,p={l:58,r:18,t:16,b:34}; canvas.width=width*ratio;canvas.height=height*ratio;
      const c=canvas.getContext('2d');c.scale(ratio,ratio);c.clearRect(0,0,width,height);if(!points.length)return;
      let min=Math.min(...points.map(point=>point.value)),max=Math.max(...points.map(point=>point.value));const spread=max-min||Math.max(max*.1,1);min=Math.max(0,min-spread*.2);max+=spread*.2;
      const cw=width-p.l-p.r,ch=height-p.t-p.b,x=i=>p.l+(points.length===1?cw/2:cw*i/(points.length-1)),y=v=>p.t+ch-(v-min)/(max-min)*ch;
      c.font='11px IBM Plex Sans';c.strokeStyle=colors.grid;c.fillStyle=colors.text;c.lineWidth=1;
      for(let i=0;i<=4;i++){const yy=p.t+ch*i/4;c.beginPath();c.moveTo(p.l,yy);c.lineTo(width-p.r,yy);c.stroke();c.fillText(number(max-(max-min)*i/4),5,yy+4);}
      c.strokeStyle=colors.line;c.lineWidth=2.5;c.beginPath();points.forEach((point,i)=>i?c.lineTo(x(i),y(point.value)):c.moveTo(x(i),y(point.value)));c.stroke();
      c.fillStyle=colors.line;points.forEach((point,i)=>{c.beginPath();c.arc(x(i),y(point.value),3,0,Math.PI*2);c.fill();});
      c.fillStyle=colors.text;c.fillText(new Date(points[0].date).toLocaleDateString(),p.l,height-8);const last=new Date(points.at(-1).date).toLocaleDateString();c.fillText(last,width-p.r-c.measureText(last).width,height-8);
    }
    function renderTable(run) {
      return run.benchmarks.map(item=>{const metric=item.primary_metric,value=item.metrics[metric]?.median,itemSeries=dimensionRuns().map(historyRun=>({run:historyRun,benchmark:benchmark(historyRun,item.id)})).filter(entry=>entry.benchmark),check=assessment(itemSeries,itemSeries.length-1,metric,item.higher_is_better);return `<tr><td><strong>${item.name}</strong><small>${Object.values(item.parameters).join(' / ')}</small></td><td><code>${Number.isFinite(value)?number(value):'n/a'} ${metricUnit(metric)}</code></td><td>${check.delta===null?'n/a':`${check.delta>=0?'+':''}${check.delta.toFixed(1)}%`}</td><td><span class="pill ${check.status}">${check.status}</span></td></tr>`;}).join('');
    }
    function render() {
      const items=series(),content=document.getElementById('content');if(!items.length){content.innerHTML='<div class="empty">No complete run matches these dimensions.</div>';return;}
      const latest=items.at(-1),metric=latest.benchmark.primary_metric,check=assessment(items,items.length-1,metric,latest.benchmark.higher_is_better),value=latest.benchmark.metrics[metric].median;
      const points=items.slice(-60).map(item=>({date:item.run.generated_at,value:item.benchmark.metrics[metric].median}));
      const latestDimensionRun=dimensionRuns().at(-1);
      content.innerHTML=`<section class="summary"><div class="status-panel ${check.status}"><span>Rolling assessment</span><strong>${check.status}</strong></div><div class="summary-metric"><span>Latest median</span><strong>${number(value)} ${metricUnit(metric)}</strong><small>${latest.benchmark.name}</small></div><div class="summary-metric"><span>Versus prior 5-run median</span><strong>${check.delta===null?'No baseline':`${check.delta>=0?'+':''}${check.delta.toFixed(1)}%`}</strong><small>${latest.run.run.commit.slice(0,12)}</small></div></section>
      <section class="chart-panel"><div class="panel-title"><div><h2>${latest.benchmark.name}</h2><p>${titleCase(metric)} · last ${points.length} runs</p></div></div><canvas id="trend"></canvas></section>
      <section class="table-panel"><div class="panel-title"><div><h2>Latest workload matrix</h2><p>${latestDimensionRun.run.commit.slice(0,12)} · ${new Date(latestDimensionRun.generated_at).toLocaleString()}</p></div></div><div class="table-wrap"><table><thead><tr><th>Workload</th><th>Median</th><th>Rolling change</th><th>Status</th></tr></thead><tbody>${renderTable(latestDimensionRun)}</tbody></table></div></section>`;
      requestAnimationFrame(()=>draw(document.getElementById('trend'),points));
    }
    async function start(){try{const response=await fetch('../data/developer/history.json',{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();state.runs=data.runs;document.getElementById('updated').textContent=`UPDATED ${new Date(data.updated_at).toLocaleString()}`;
      setOptions('suite',unique(state.runs.map(item=>item.run.suite)),'regression');setOptions('architecture',unique(state.runs.map(item=>item.run.architecture)),'X86');setOptions('account',unique(state.runs.map(item=>item.run.account_type)),'premium');setOptions('cache',unique(state.runs.map(item=>item.run.cache_mode)),'block_cache');const preferredRun=runsBeforeCompute().at(-1);refreshCompute(computeProfile(preferredRun||state.runs.at(-1)));refreshWorkloads();window.addEventListener('resize',render);render();
    }catch(error){document.getElementById('content').innerHTML=`<div class="empty">Developer history is unavailable: ${error.message}</div>`;}}
    start();
  </script>
</body>
</html>
