name: Blobfuse2 performance test
description: Build Blobfuse2 and run reproducible FIO benchmark suites

inputs:
  ARCH:
    description: Runner architecture label
    required: true
  EXPECTED_CPU_COUNT:
    description: Required online CPU count for this benchmark profile
    required: true
  EXPECTED_VM_SIZE:
    description: Required Azure VM SKU for this benchmark profile
    required: true
  SETUP_HOST:
    description: Install dependencies, build Blobfuse2, and prepare local storage
    required: false
    default: "true"
  RUN_PROFILE:
    description: Generate configuration and run the selected account/cache profile
    required: false
    default: "true"
  ACCOUNT_NAME:
    description: Azure Storage account name
    required: true
  ACCOUNT_KEY:
    description: Azure Storage account key
    required: true
  ACCOUNT_TYPE:
    description: Public benchmark account dimension
    required: true
  BENCH_CONTAINER:
    description: Existing container reserved for performance tests
    required: true
  CACHE_MODE:
    description: Cache component under test
    required: true
  RUN_PUBLIC:
    description: Run the curated public suite
    required: false
    default: "false"
  RUN_REGRESSION:
    description: Run the developer regression suite
    required: false
    default: "true"
  RUN_ID:
    description: Stable identifier for this workflow run
    required: true
  COMMIT:
    description: Commit being benchmarked
    required: true
  REF:
    description: Git ref being benchmarked
    required: true

runs:
  using: composite
  steps:
    - name: Record benchmark host
      if: ${{ inputs.SETUP_HOST == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        hostnamectl || true
        lscpu | sed -n '1,24p'
        free -h
        lsblk -o NAME,MODEL,SIZE,TYPE,MOUNTPOINT
        actual_cpu_count="$(nproc)"
        if [[ "$actual_cpu_count" != "${{ inputs.EXPECTED_CPU_COUNT }}" ]]; then
          echo "Expected ${{ inputs.EXPECTED_CPU_COUNT }} online CPUs, found ${actual_cpu_count}" >&2
          exit 1
        fi

    - name: Install benchmark dependencies
      if: ${{ inputs.SETUP_HOST == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        sudo -n systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
        sudo -n sh -c 'echo "DPkg::Lock::Timeout \"120\";" > /etc/apt/apt.conf.d/99blobfuse-benchmark-timeout'
        sudo -n dpkg --configure -a
        sudo -n apt-get update -qq
        sudo -n apt-get install -y -qq fuse3 libfuse3-dev gcc jq python3 bc libaio-dev build-essential curl git iproute2 zip unzip
        if ! command -v fio >/dev/null || [[ "$(fio --version)" != "fio-3.36" ]]; then
          ./tools/install_fio.sh
        fi
        fio --version
        actual_vm_size="$(curl --noproxy '*' -fsS -H Metadata:true \
          'http://169.254.169.254/metadata/instance/compute?api-version=2021-02-01' | jq -r '.vmSize')"
        if [[ "$actual_vm_size" != "${{ inputs.EXPECTED_VM_SIZE }}" ]]; then
          echo "Expected Azure VM ${{ inputs.EXPECTED_VM_SIZE }}, found ${actual_vm_size}" >&2
          exit 1
        fi

    - name: Install Go and build candidate
      if: ${{ inputs.SETUP_HOST == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        ./go_installer.sh ../ >/dev/null
        go version
        ./build.sh >/dev/null
        ./blobfuse2 --version

    - name: Prepare local benchmark storage
      if: ${{ inputs.SETUP_HOST == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        sudo -n mkdir -p /mnt/localssd
        sudo -n chmod 0777 /mnt/localssd
        minimum_free_bytes=$((200 * 1024 * 1024 * 1024))
        cache_root=""
        for candidate in /mnt/localssd /mnt/azure_nvme_temp /mnt/resource; do
          [[ -d "$candidate" ]] || continue
          mount_target="$(findmnt -rn -o TARGET -T "$candidate" 2>/dev/null || true)"
          mount_source="$(findmnt -rn -o SOURCE -T "$candidate" 2>/dev/null || true)"
          available_bytes="$(df --output=avail -B1 "$candidate" 2>/dev/null | tail -n 1 | tr -d ' ' || true)"
          [[ "$available_bytes" =~ ^[0-9]+$ ]] || available_bytes=0
          echo "Local cache candidate ${candidate}: target=${mount_target:-none}, source=${mount_source:-none}, available=${available_bytes}"
          if [[ -n "$mount_target" && "$mount_target" != "/" && "$available_bytes" -ge "$minimum_free_bytes" ]]; then
            cache_root="$candidate"
            break
          fi
        done
        echo "PERF_LOCAL_CACHE_ROOT=$cache_root" >> "$GITHUB_ENV"
        if [[ -n "$cache_root" ]]; then
          sudo -n install -d -m 0755 -o "$(id -u)" -g "$(id -g)" "$cache_root/blobfuse-benchmark-cache"
          echo "Selected local cache root: $cache_root"
          df -h "$cache_root"
        else
          echo "::warning::No non-root local filesystem with at least 200 GiB free was found; file-cache profiles will be rejected"
        fi

    - name: Configure benchmark paths and credentials
      if: ${{ inputs.RUN_PROFILE == 'true' }}
      shell: bash
      env:
        PERF_ACCOUNT_NAME_INPUT: ${{ inputs.ACCOUNT_NAME }}
        PERF_ACCOUNT_KEY_INPUT: ${{ inputs.ACCOUNT_KEY }}
      run: |
        set -euo pipefail
        suffix="${{ inputs.RUN_ID }}-${{ inputs.ARCH }}-${{ inputs.ACCOUNT_TYPE }}-${{ inputs.CACHE_MODE }}"
        printf 'AZURE_STORAGE_ACCOUNT=%s\n' "$PERF_ACCOUNT_NAME_INPUT" >> "$GITHUB_ENV"
        printf 'AZURE_STORAGE_ACCESS_KEY=%s\n' "$PERF_ACCOUNT_KEY_INPUT" >> "$GITHUB_ENV"
        cache_root="${PERF_LOCAL_CACHE_ROOT:-/mnt/localssd}"
        echo "PERF_MOUNT_DIR=/mnt/blobfuse-benchmark-${suffix}" >> "$GITHUB_ENV"
        echo "PERF_CACHE_DIR=${cache_root}/blobfuse-benchmark-cache/${suffix}" >> "$GITHUB_ENV"
        echo "PERF_CONFIG=${RUNNER_TEMP}/blobfuse-benchmark-${suffix}.yaml" >> "$GITHUB_ENV"
        echo "PERF_RESULTS=${GITHUB_WORKSPACE}/benchmark-results/${{ inputs.ARCH }}/${{ inputs.ACCOUNT_TYPE }}/${{ inputs.CACHE_MODE }}" >> "$GITHUB_ENV"

    - name: Validate profile storage
      if: ${{ inputs.RUN_PROFILE == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${{ inputs.CACHE_MODE }}" == "file_cache" ]]; then
          if [[ -z "${PERF_LOCAL_CACHE_ROOT:-}" ]]; then
            echo "File-cache benchmarks require a non-root local filesystem with at least 200 GiB free" >&2
            exit 1
          fi
          mount_target="$(findmnt -rn -o TARGET -T "$PERF_LOCAL_CACHE_ROOT" 2>/dev/null || true)"
          mount_source="$(findmnt -rn -o SOURCE -T "$PERF_LOCAL_CACHE_ROOT" 2>/dev/null || true)"
          if [[ -z "$mount_target" || "$mount_target" == "/" ]]; then
            echo "File-cache path $PERF_LOCAL_CACHE_ROOT is not backed by a dedicated local filesystem" >&2
            exit 1
          fi
          echo "Using file-cache storage $PERF_LOCAL_CACHE_ROOT (target=$mount_target, source=$mount_source)"
        fi

    - name: Generate benchmark mount configuration
      if: ${{ inputs.RUN_PROFILE == 'true' }}
      shell: bash
      env:
        PERF_CONTAINER_INPUT: ${{ inputs.BENCH_CONTAINER }}
      run: |
        set -euo pipefail
        sudo -n install -d -m 0755 -o "$(id -u)" -g "$(id -g)" "$PERF_MOUNT_DIR"
        mkdir -p "$PERF_RESULTS" "$PERF_CACHE_DIR"
        if [[ "${{ inputs.CACHE_MODE }}" == "block_cache" ]]; then
          ./blobfuse2 gen-test-config \
            --config-file=azure_block_benchmark.yaml \
            --container-name="$PERF_CONTAINER_INPUT" \
            --output-file="$PERF_CONFIG"
        elif [[ "${{ inputs.CACHE_MODE }}" == "file_cache" ]]; then
          ./blobfuse2 gen-test-config \
            --config-file=azure_file_benchmark.yaml \
            --container-name="$PERF_CONTAINER_INPUT" \
            --temp-path="$PERF_CACHE_DIR" \
            --output-file="$PERF_CONFIG"
        else
          echo "Unsupported cache mode: ${{ inputs.CACHE_MODE }}" >&2
          exit 1
        fi
        if grep -q 'direct-io: true' "$PERF_CONFIG"; then
          echo "Benchmark config must not enable mount-wide direct I/O" >&2
          exit 1
        fi

    - name: Run public sustained-throughput suite
      if: ${{ inputs.RUN_PROFILE == 'true' && inputs.RUN_PUBLIC == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        [[ "${{ inputs.CACHE_MODE }}" == "block_cache" ]] || { echo "Public suite only supports block cache" >&2; exit 1; }
        [[ "${{ inputs.ACCOUNT_TYPE }}" == "standard" || "${{ inputs.ACCOUNT_TYPE }}" == "premium" ]] || { echo "Public suite only supports non-HNS accounts" >&2; exit 1; }
        python3 perf_testing/scripts/run_benchmark.py \
          --binary ./blobfuse2 \
          --config "$PERF_CONFIG" \
          --suite public \
          --mount-dir "$PERF_MOUNT_DIR" \
          --cache-dir "$PERF_CACHE_DIR" \
          --output-dir "$PERF_RESULTS/public" \
          --run-id "${{ inputs.RUN_ID }}" \
          --label main \
          --commit "${{ inputs.COMMIT }}" \
          --ref "${{ inputs.REF }}" \
          --architecture "${{ inputs.ARCH }}" \
          --account-type "${{ inputs.ACCOUNT_TYPE }}" \
          --cache-mode "${{ inputs.CACHE_MODE }}"

    - name: Run developer regression suite
      if: ${{ inputs.RUN_PROFILE == 'true' && inputs.RUN_REGRESSION == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        python3 perf_testing/scripts/run_benchmark.py \
          --binary ./blobfuse2 \
          --config "$PERF_CONFIG" \
          --suite regression \
          --mount-dir "$PERF_MOUNT_DIR" \
          --cache-dir "$PERF_CACHE_DIR" \
          --output-dir "$PERF_RESULTS/regression" \
          --run-id "${{ inputs.RUN_ID }}" \
          --label main \
          --commit "${{ inputs.COMMIT }}" \
          --ref "${{ inputs.REF }}" \
          --architecture "${{ inputs.ARCH }}" \
          --account-type "${{ inputs.ACCOUNT_TYPE }}" \
          --cache-mode "${{ inputs.CACHE_MODE }}"

    - name: Collect benchmark failure diagnostics
      if: ${{ failure() && inputs.RUN_PROFILE == 'true' }}
      shell: bash
      run: |
        set +e
        diagnostics="$PERF_RESULTS/diagnostics"
        mkdir -p "$diagnostics"

        {
          date -u
          uname -a
          echo
          echo "--- memory ---"
          free -h
          echo
          echo "--- filesystems ---"
          df -h
          echo
          echo "--- mounts ---"
          findmnt
          echo
          echo "--- block devices ---"
          lsblk -o NAME,MODEL,SIZE,TYPE,FSTYPE,MOUNTPOINTS
          echo
          echo "--- benchmark result files ---"
          find "$PERF_RESULTS" -maxdepth 4 -type f -printf '%P %s bytes\n' | sort
        } > "$diagnostics/host-state.txt" 2>&1

        sudo -n dmesg --ctime 2>&1 | tail -n 500 > "$diagnostics/kernel.log"

    - name: Archive redacted benchmark configuration
      if: ${{ always() && inputs.RUN_PROFILE == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        diagnostics="$PERF_RESULTS/diagnostics"
        mkdir -p "$diagnostics"
        if [[ -f "$PERF_CONFIG" ]]; then
          sed -E 's/^([[:space:]]*account-key:).*/\1 <redacted>/' \
            "$PERF_CONFIG" > "$diagnostics/mount-config.redacted.yaml"
        fi

    - name: Remove generated secrets and mounts
      if: ${{ always() && inputs.RUN_PROFILE == 'true' }}
      shell: bash
      run: |
        set +e
        ./blobfuse2 unmount "$PERF_MOUNT_DIR" >/dev/null 2>&1
        fusermount3 -u -z "$PERF_MOUNT_DIR" >/dev/null 2>&1
        rm -f "$PERF_CONFIG"
        rm -rf "$PERF_CACHE_DIR"
        rmdir "$PERF_MOUNT_DIR" >/dev/null 2>&1 || true
