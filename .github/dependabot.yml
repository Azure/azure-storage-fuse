version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # Version updates cover direct modules only. Vulnerable indirect modules
    # are handled by Dependabot security updates (enabled in repo settings).
    groups:
      azure-sdk:
        patterns:
          - "github.com/Azure/*"
          - "github.com/AzureAD/*"
      go-deps:
        patterns:
          - "*"
