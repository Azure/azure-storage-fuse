version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    # Version updates skip indirect modules by default; include them so
    # vulnerable transitive dependencies are bumped too.
    allow:
      - dependency-type: "all"