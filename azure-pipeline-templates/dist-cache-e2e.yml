# Template: distributed cache E2E on a local kind + DACS cluster.
#
# Brings up a kind (Kubernetes IN Docker) cluster, deploys the DACS
# Helm chart (pulled anonymously from MCR over OCI), builds
# the in-cluster blobfuse2 container image from the code under test, deploys
# it, and runs the dedicated dcache_e2e Go suite.
#
# The caller must run azure-pipeline-templates/build.yml (or otherwise
# provision Go + libfuse3 + docker) before including this template, since
# the blobfuse2 build step invokes docker/buildcontainer.sh.
#
# Teardown runs unconditionally and publishes cache-server and per-test
# blobfuse2 logs as an artifact so failures are debuggable.

parameters:
  # Identifier for this cluster invocation. Used to name cluster-log
  # artifacts and per-cluster step display names.
  - name: run_idstring
    type: string
  - name: distro_name
    type: string
  - name: account_name
    type: string
  - name: account_key
    type: string

steps:
  # -------------------------------------------------------------------------
  # 1. Install kind / kubectl / helm / docker if missing.
  - script: |
      set -e
      chmod +x $(WORK_DIR)/test/scripts/dcache/*.sh
      $(WORK_DIR)/test/scripts/dcache/install-prereqs.sh
    displayName: 'DistCache [${{ parameters.run_idstring }}]: Install prerequisites'
    timeoutInMinutes: 15

  # -------------------------------------------------------------------------
  # 1b. Raise the host inotify budget before anything allocates from it.
  #
  # The kind "nodes" are plain containers that do not enter a user namespace,
  # so every process in the cluster draws on this host's uid-keyed
  # fs.inotify.max_user_instances budget. The usual default is 128 and this
  # suite has been measured at 139-145 instances once three cache-server
  # replicas are up, so without this step the budget runs out mid-run.
  #
  # Exhaustion is worth avoiding because nothing reports it usefully. The
  # kernel only fails the next inotify_init(2) with EMFILE; whichever process
  # happens to make that call is the one that breaks, and already-running
  # processes keep working, so the symptom appears far from the cause:
  #   - kube-proxy exits with "failed complete: too many open files" and
  #     crash-loops, stranding its node without a single Service ClusterIP,
  #     kube-dns included. Pods scheduled there hang before mounting.
  #   - blobfuse2 dies with no log at all, because viper's WatchConfig calls
  #     os.Exit(1) when fsnotify.NewWatcher fails and routes the message to a
  #     discard handler. Keeping the budget clear is what prevents this.
  - script: |
      set -e
      # The kernel exposes the limit but no in-use counter, so count the fds it
      # reports as inotify instances. Needs root to see container processes -
      # the ones that actually consume the budget - so fall back to an
      # explicitly labelled partial count rather than a misleading zero.
      count_inotify() {
        if sudo -n true 2>/dev/null; then
          sudo -n find /proc -maxdepth 3 -path '/proc/[0-9]*/fd/*' \
            -lname 'anon_inode:inotify' 2>/dev/null | wc -l
        else
          echo "$(find /proc -maxdepth 3 -path '/proc/[0-9]*/fd/*' \
            -lname 'anon_inode:inotify' 2>/dev/null | wc -l) (PARTIAL: no passwordless sudo)"
        fi
      }
      report() {
        echo "inotify $1:"
        for f in max_user_instances max_user_watches; do
          printf '  %-22s %s\n' "$f" "$(cat /proc/sys/fs/inotify/$f 2>/dev/null || echo '<unreadable>')"
        done
        printf '  %-22s %s\n' "instances-in-use" "$(count_inotify)"
      }
      report "before"
      # Non-fatal: a locked-down agent may refuse. The before/after reports
      # record which applies, so a later EMFILE failure can be attributed.
      sudo -n sysctl -w fs.inotify.max_user_instances=8192 \
        || echo "WARNING: could not raise fs.inotify.max_user_instances; the suite may exhaust the host budget"
      sudo -n sysctl -w fs.inotify.max_user_watches=1048576 \
        || echo "WARNING: could not raise fs.inotify.max_user_watches"
      report "after"
    displayName: 'DistCache [${{ parameters.run_idstring }}]: Raise host inotify limits'
    timeoutInMinutes: 5

  # -------------------------------------------------------------------------
  # 2. Bring up the kind cluster.
  - script: |
      set -e
      $(WORK_DIR)/test/scripts/dcache/setup-kind.sh
    displayName: 'DistCache [${{ parameters.run_idstring }}]: Create kind cluster'
    timeoutInMinutes: 30

  # -------------------------------------------------------------------------
  # 3. Deploy DACS via Helm using public MCR artifacts.
  - script: |
      set -euo pipefail
      $(WORK_DIR)/test/scripts/dcache/deploy-dacs.sh
    displayName: 'DistCache [${{ parameters.run_idstring }}]: Deploy DACS'
    timeoutInMinutes: 30

  # -------------------------------------------------------------------------
  # 4. Build the in-cluster blobfuse2 container image from the code under
  #    test. buildcontainer.sh runs ./build.sh and tags the image as
  #    azure-blobfuse2-x86_64.<ver>; we expose the tag as pipeline variable
  #    BLOBFUSE2_IMAGE so the deploy step below picks it up. The image lives
  #    only in the local Docker daemon; deploy-blobfuse2.sh does not pull.
  - script: |
      set -euo pipefail
      cd $(WORK_DIR)/docker
      ./buildcontainer.sh Dockerfile x86_64
      ver=$($(WORK_DIR)/blobfuse2 --version | cut -d ' ' -f 3)
      tag="azure-blobfuse2-x86_64.${ver}"
      echo "Built blobfuse2 container image: ${tag}"
      docker images "${tag}"
      echo "##vso[task.setvariable variable=BLOBFUSE2_IMAGE]${tag}"
    displayName: 'DistCache [${{ parameters.run_idstring }}]: Build blobfuse2 container image'
    timeoutInMinutes: 20

  # -------------------------------------------------------------------------
  # 5. Deploy the in-cluster blobfuse2 pod driven by dcache_e2e.
  - script: |
      set -e
      $(WORK_DIR)/test/scripts/dcache/deploy-blobfuse2.sh
    displayName: 'DistCache [${{ parameters.run_idstring }}]: Deploy blobfuse2 pod'
    timeoutInMinutes: 10
    env:
      BLOBFUSE2_IMAGE: $(BLOBFUSE2_IMAGE)
      STO_ACC_NAME: ${{ parameters.account_name }}
      STO_ACC_KEY: ${{ parameters.account_key }}
      STO_ACC_ENDPOINT: 'https://${{ parameters.account_name }}.blob.core.windows.net'
      STO_ACC_CONTAINER: $(containerName)

  # -------------------------------------------------------------------------
  # 6. Run only the distributed-cache-specific pod suite.
  #
  # TestNodeFailure no longer restarts a kind node container. It stops kubelet
  # on the victim and stops that node's cache-server container directly, then
  # starts kubelet again, which restores both. Nothing is destroyed - the
  # network namespace, pod IPs, iptables, kindnet routes and /dev/fuse all
  # survive - so the node is left usable and the suite needs no ordering
  # constraint or second pass.
  - script: |
      set -e
      cd $(WORK_DIR)
      go test -v -timeout=30m -tags=fuse3 ./test/dcache_e2e/... -args \
        -pod-namespace=blobfuse2-dist-cache \
        -pod-deployment=blobfuse2-dist-cache \
        -pod-mount-path=/mnt/blobfuse_mnt \
        -kubectl-bin=kubectl \
        -docker-bin=docker \
        -storage-account=${{ parameters.account_name }} \
        -storage-key=${{ parameters.account_key }} \
        -storage-endpoint=https://${{ parameters.account_name }}.blob.core.windows.net \
        -storage-container=$(containerName)
    displayName: 'DistCache: dcache_e2e Go tests'
    timeoutInMinutes: 60
    continueOnError: false
    env:
      DCACHE_LOG_DIR: '$(Agent.TempDirectory)/dcache_logs_${{ parameters.run_idstring }}'

  # -------------------------------------------------------------------------
  # 7. Collect surviving pod logs before tearing down, then teardown always.
  - script: |
      set +e
      NAMESPACE="${NAMESPACE:-cache-server}"
      out_dir="$(Agent.TempDirectory)/dcache_logs_${{ parameters.run_idstring }}"
      mkdir -p "$out_dir"
      kubectl get pods -n "$NAMESPACE" -o wide > "$out_dir/pods.txt" 2>&1 || true
      kubectl describe pods -n "$NAMESPACE" > "$out_dir/pods-describe.txt" 2>&1 || true
      # Per-test Deployments are deleted in t.Cleanup, so anything left here is
      # incidental. Capture the namespace state anyway: node placement, restart
      # counts and probe events are what distinguish a crashing mount from a
      # broken node, and the Go suite cannot record them after deletion.
      kubectl get pods -n blobfuse2-dist-cache -o wide > "$out_dir/blobfuse2-pods.txt" 2>&1 || true
      kubectl describe pods -n blobfuse2-dist-cache > "$out_dir/blobfuse2-pods-describe.txt" 2>&1 || true
      kubectl get nodes -o wide > "$out_dir/nodes.txt" 2>&1 || true
      kubectl get events -A --sort-by=.lastTimestamp > "$out_dir/events.txt" 2>&1 || true
      # Post-run inotify budget. If kube-proxy crash-looped, this says whether
      # the budget was genuinely exhausted or the cause lies elsewhere.
      {
        echo "inotify at teardown:"
        for f in max_user_instances max_user_watches; do
          printf '  %-22s %s\n' "$f" "$(cat /proc/sys/fs/inotify/$f 2>/dev/null || echo '<unreadable>')"
        done
        printf '  %-22s %s\n' "instances-in-use" \
          "$(sudo -n find /proc -maxdepth 3 -path '/proc/[0-9]*/fd/*' -lname 'anon_inode:inotify' 2>/dev/null | wc -l)"
        echo
        echo "top inotify consumers (instances command):"
        sudo -n find /proc -maxdepth 3 -path '/proc/[0-9]*/fd/*' -lname 'anon_inode:inotify' 2>/dev/null \
          | cut -d/ -f3 | sort | uniq -c | sort -rn | head -20 \
          | while read -r count pid; do
              printf '  %-8s %-8s %s\n' "$count" "$pid" "$(cat /proc/$pid/comm 2>/dev/null || echo '<gone>')"
            done
      } > "$out_dir/inotify.txt" 2>&1 || true
      # kube-proxy is no longer restarted by TestNodeFailure, but these logs are
      # cheap and remain the only in-band evidence if a node ever does lose its
      # Service ClusterIPs.
      kube_dir="$out_dir/kube-system"
      mkdir -p "$kube_dir"
      kubectl describe pods -n kube-system -l k8s-app=kube-proxy > "$kube_dir/kube-proxy-describe.txt" 2>&1 || true
      for pod in $(kubectl get pods -n kube-system -l k8s-app=kube-proxy -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
        kubectl logs -n kube-system "$pod" --timestamps > "$kube_dir/${pod}.log" 2>&1 || true
        kubectl logs -n kube-system "$pod" --timestamps --previous > "$kube_dir/${pod}.previous.log" 2>&1 || true
      done
      # Collected after node restore, so the killed cache server's container has
      # already restarted by now: --previous holds the only copy of the log
      # covering the failure window, i.e. whether that server ever received the
      # GetCacheServers discovery RPC and how it answered. --timestamps lets
      # those lines be aligned against the discovery moment in the blobfuse log.
      for pod in $(kubectl get pods -n "$NAMESPACE" -l app=cacheserver -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
        kubectl logs -n "$NAMESPACE" "$pod" --all-containers --prefix --timestamps > "$out_dir/${pod}.log" 2>&1 || true
        kubectl logs -n "$NAMESPACE" "$pod" --all-containers --prefix --timestamps --previous > "$out_dir/${pod}.previous.log" 2>&1 || true
      done
      blobfuse_dir="$out_dir/blobfuse2/surviving-pods"
      mkdir -p "$blobfuse_dir"
      for pod in $(kubectl get pods -n blobfuse2-dist-cache -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
        kubectl logs -n blobfuse2-dist-cache "$pod" \
          --all-containers=true --prefix --timestamps \
          > "$blobfuse_dir/${pod}.log" 2>&1 || true
        kubectl logs -n blobfuse2-dist-cache "$pod" \
          --all-containers=true --prefix --timestamps --previous \
          > "$blobfuse_dir/${pod}.previous.log" 2>&1 || true
      done
      find "$out_dir" -maxdepth 4 -type f -print || true
    displayName: 'DistCache [${{ parameters.run_idstring }}]: Collect distributed cache logs'
    condition: always()

  - task: PublishBuildArtifacts@1
    displayName: 'DistCache [${{ parameters.run_idstring }}]: Publish distributed cache logs'
    condition: always()
    inputs:
      pathToPublish: '$(Agent.TempDirectory)/dcache_logs_${{ parameters.run_idstring }}'
      artifactName: 'dcache_logs_${{ parameters.distro_name }}_${{ parameters.run_idstring }}'

  - script: |
      $(WORK_DIR)/test/scripts/dcache/teardown-kind.sh
    displayName: 'DistCache [${{ parameters.run_idstring }}]: Teardown kind cluster'
    condition: always()
    timeoutInMinutes: 15
