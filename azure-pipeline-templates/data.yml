# Generate files in Local Filesystem. files would be created at $(DATA_DIR)
# Copy those files using to the mountpoint using CLI utilities.
parameters:
  - name: generate_data
    type: boolean
    default: false
  - name: copy_data
    type: boolean
    default: false
  - name: check_consistency
    type: boolean
    default: false
  - name: metrics_file
    type: string
    default: ''
  - name: metrics_prefix
    type: string
    default: ''

steps:
  - ${{ if eq(parameters.generate_data, true) }}:
    - script: |
        DATA_DIR=$(ROOT_DIR)/data_files
        sudo rm -rf $DATA_DIR
        sudo mkdir -p $DATA_DIR
        sudo chown -R `whoami` $DATA_DIR
        chmod 777 $DATA_DIR
        echo "##vso[task.setvariable variable=DATA_DIR]$DATA_DIR"
      displayName: "Create directory structure for storing files in local filesystem"

    - bash: |
        generate_random_file() {
          local bs=$1

          # Generate files with random content using dd
          for count in "${file_counts[@]}"; do
            file_name="$(DATA_DIR)/random_file_${size}_${bs}_${count}.txt"

            echo "Generating file: $file_name"
            # Use dd to create a file with random content
            dd if=/dev/urandom of="$file_name" bs="$bs" count="$count" status=progress
            echo "File $file_name generated successfully!"
          done

          # Generate files with holes (sparse files)
          for count in "${file_counts[@]}"; do
            file_name="$(DATA_DIR)/sparse_file_${size}_${bs}_${count}.txt"

            echo "Generating sparse file: $file_name"
            # Create a sparse file using dd with seek
            dd if=/dev/urandom of="$file_name" bs="$bs" seek=$count count=1 status=progress
            dd if=/dev/urandom of="$file_name" bs="$bs" seek=$((count+4)) count=1 status=progress
            dd if=/dev/urandom of="$file_name" bs="$bs" seek=$((count+8)) count=1 status=progress
            echo "Sparse file $file_name generated successfully!"
          done

          # Generate files with hole in the end.
          for count in "${file_counts[@]}"; do
            file_name="$(DATA_DIR)/file_with_hole_end_${size}_${bs}_${count}.txt"

            echo "Generating file with hole at the end: $file_name"
            # Create a file with data followed by a hole using dd with seek
            dd if=/dev/urandom of="$file_name" bs="$bs" count=$count status=progress
            dd if=/dev/zero of="$file_name" bs="$bs" seek=$((count + 10)) count=0 status=progress
            echo "File with hole at the end $file_name generated successfully!"
          done
        }

        file_counts=(1 2 4 7 8 9 10 20 30 50 100 200 1024 2048 4096)
        echo "*************************Generate very small files*****************************"
        generate_random_file "1"
        echo "*************************Generating small files********************************"
        generate_random_file "1K"
        echo "*************************Generating medium files********************************"
        generate_random_file "1M"

      displayName: "Generate files with random data using dd command"

    - bash: |
        ls -lrt
      displayName: "List the generated Files"
      workingDirectory: $(DATA_DIR)

    - bash: |
        md5sum * | tee ~/checklist.chk
        cat ~/checklist.chk | cut -d " " -f1 > ~/checklist.chk1
      displayName: "Generate md5sum of the generated files"
      workingDirectory: $(DATA_DIR)

  - ${{ if eq(parameters.copy_data, true) }}:
    - bash: |
        source $(WORK_DIR)/test/scripts/io_metrics.sh
        copy_files() {
          cp -v $(DATA_DIR)/* $(MOUNT_DIR)/
        }
        bytes=$(find $(DATA_DIR) -maxdepth 1 -type f -printf '%s\n' | awk '{total += $1} END {print total + 0}')
        if [ -n "${METRICS_FILE}" ]; then
          measure_io_case "$METRICS_FILE" "${METRICS_PREFIX}: Local -> Mountpoint (sequential)" write "$bytes" copy_files
        else
          copy_files
        fi
      displayName: "Sequential Copy of Files [Local -> Mountpoint]"
      env:
        METRICS_FILE: ${{ parameters.metrics_file }}
        METRICS_PREFIX: ${{ parameters.metrics_prefix }}

    - bash: |
        source $(WORK_DIR)/test/scripts/io_metrics.sh
        copy_files() {
          for file in $(MOUNT_DIR)/*; do
            cp -v "$file" "$(MOUNT_DIR)/$(basename "$file").SEQ"
          done
        }
        bytes=$(find $(MOUNT_DIR) -maxdepth 1 -type f -printf '%s\n' | awk '{total += $1} END {print total + 0}')
        if [ -n "${METRICS_FILE}" ]; then
          measure_io_case "$METRICS_FILE" "${METRICS_PREFIX}: Mountpoint -> Mountpoint (sequential)" read+write "$bytes" copy_files
        else
          copy_files
        fi
      displayName: "Sequential Copy of Files [Mountpoint -> Mountpoint]"
      env:
        METRICS_FILE: ${{ parameters.metrics_file }}
        METRICS_PREFIX: ${{ parameters.metrics_prefix }}

    - bash: |
        source $(WORK_DIR)/test/scripts/io_metrics.sh
        copy_files() {
          find $(DATA_DIR) -type f | parallel --will-cite -j 5 'cp -v {} $(MOUNT_DIR)/$(basename {}).TPAR'
        }
        bytes=$(find $(DATA_DIR) -type f -printf '%s\n' | awk '{total += $1} END {print total + 0}')
        if [ -n "${METRICS_FILE}" ]; then
          measure_io_case "$METRICS_FILE" "${METRICS_PREFIX}: Local -> Mountpoint (parallel)" write "$bytes" copy_files
        else
          copy_files
        fi
      displayName: "Parallel Copy of Files [Local -> Mountpoint]"
      env:
        METRICS_FILE: ${{ parameters.metrics_file }}
        METRICS_PREFIX: ${{ parameters.metrics_prefix }}

    - bash: |
        source $(WORK_DIR)/test/scripts/io_metrics.sh
        copy_files() {
          find $(DATA_DIR) -type f | parallel --will-cite -j 5 'cp -v $(MOUNT_DIR)/$(basename {}) $(MOUNT_DIR)/$(basename {}).APAR'
        }
        bytes=$(find $(DATA_DIR) -type f -printf '%s\n' | awk '{total += $1} END {print total + 0}')
        if [ -n "${METRICS_FILE}" ]; then
          measure_io_case "$METRICS_FILE" "${METRICS_PREFIX}: Mountpoint -> Mountpoint (parallel)" read+write "$bytes" copy_files
        else
          copy_files
        fi
      displayName: "Parallel Copy of Files [Mountpoint -> Mountpoint]"
      env:
        METRICS_FILE: ${{ parameters.metrics_file }}
        METRICS_PREFIX: ${{ parameters.metrics_prefix }}

  # drop kernel page cache before getting the md5sums as copy might happened just now
  - ${{ if eq(parameters.check_consistency, true) }}:
    - bash: |
        source $(WORK_DIR)/test/scripts/io_metrics.sh
        sudo sh -c "sync; echo 3 > /proc/sys/vm/drop_caches"
        rm -v ~/mc*

        checksum_files() {
          local suffix="$1"
          local output="$2"
          for file in $(DATA_DIR)/*; do
            md5sum "$(MOUNT_DIR)/$(basename "$file")${suffix}" | tee -a "$output"
          done
        }

        measure_checksums() {
          local suffix="$1"
          local output="$2"
          local label="$3"
          local bytes
          bytes=$(find $(DATA_DIR) -maxdepth 1 -type f -printf '%s\n' | awk '{total += $1} END {print total + 0}')
          if [ -n "${METRICS_FILE}" ]; then
            measure_io_case "$METRICS_FILE" "${METRICS_PREFIX}: ${label}" read "$bytes" checksum_files "$suffix" "$output"
          else
            checksum_files "$suffix" "$output"
          fi
        }

        measure_checksums "" ~/mc1.chk "Read original files"
        measure_checksums ".SEQ" ~/mc2.chk "Read sequential copies"
        measure_checksums ".TPAR" ~/mc3.chk "Read parallel local copies"
        measure_checksums ".APAR" ~/mc4.chk "Read parallel mount copies"

        cat ~/mc1.chk | cut -d " " -f1 > ~/mc1.chk1
        cat ~/mc2.chk | cut -d " " -f1 > ~/mc2.chk1
        cat ~/mc3.chk | cut -d " " -f1 > ~/mc3.chk1
        cat ~/mc4.chk | cut -d " " -f1 > ~/mc4.chk1

        compare_md5sum() {
          local mount_hashes=$1
          diff ~/checklist.chk1 ${mount_hashes}
          if [ $? -ne 0 ]; then
            exit 1
          fi
        }

        compare_md5sum ~/mc1.chk1
        compare_md5sum ~/mc2.chk1
        compare_md5sum ~/mc3.chk1
        compare_md5sum ~/mc4.chk1
      displayName: "Compare the MD5sum of the Mount point with Local filesystem"
      workingDirectory: $(MOUNT_DIR)
      env:
        METRICS_FILE: ${{ parameters.metrics_file }}
        METRICS_PREFIX: ${{ parameters.metrics_prefix }}
