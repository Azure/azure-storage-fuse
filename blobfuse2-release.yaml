# One-off pipeline for the blobfuse2 2.5.6 release: publishes the signed packages
# from an earlier release run to the package feeds in setup/packages.csv, without
# rebuilding, re-signing, or touching the GitHub release. Do not merge this branch.

parameters:
  - name: signed_artifacts_run_id
    displayName: 'Release run ID (buildId of the run with the signed packages)'
    type: string
    default: ''

  - name: publish_artifacts
    displayName: 'Publish Artifacts to Linux Repos'
    type: boolean
    default: false

# Do not trigger this pipeline automatically
trigger: none
pr: none

stages:
  - ${{ if eq(parameters.publish_artifacts, true) }}:
    - stage: PublishArtifacts
      jobs:
        - job: PublishArtifacts
          timeoutInMinutes: 240
          pool:
            vmImage: 'ubuntu-22.04'
          variables:
            - group: NightlyBlobFuse
            - name: root_dir
              value: '$(System.DefaultWorkingDirectory)'

          steps:
            - checkout: none

            - script: |
                if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
                  echo "##vso[task.logissue type=error]Set 'Release run ID' to the numeric buildId of the release run whose signed packages should be published."
                  exit 1
                fi
                echo "Publishing signed packages from release run $RUN_ID"
              displayName: 'Validate release run ID'
              env:
                RUN_ID: ${{ parameters.signed_artifacts_run_id }}

            - task: PipAuthenticate@1
              inputs:
                artifactFeeds: 'BlobFuse/Blobfuse'
              displayName: 'Connect to PMC artifact'

            - script: |
                pip install pmc-cli
              displayName: 'Install pmc-cli'

            - task: AzureCLI@2
              displayName: 'Test PMC installation'
              inputs:
                addSpnToEnvironment: true
                azureSubscription: 'WIF_MI_ESRP_V5'
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  pmc --version
                  pmc --auth-type wif --base-url "https://pmc-ingest.trafficmanager.net/api/v4" repo list --limit 1
                  if [ $? -ne 0 ]; then
                    exit 1
                  fi

            # download the signed artifacts produced by the earlier release run
            - task: DownloadBuildArtifacts@0
              displayName: 'Download Signed Artifacts'
              inputs:
                buildType: 'specific'
                project: '$(System.TeamProjectId)'
                pipeline: '$(System.DefinitionId)'
                buildVersionToDownload: 'specific'
                buildId: '${{ parameters.signed_artifacts_run_id }}'
                downloadType: 'single'
                artifactName: 'blobfuse2-signed'
                downloadPath: $(Build.ArtifactStagingDirectory)

            # refuse to publish anything other than the 2.5.6 packages this branch is for
            - script: |
                set -euo pipefail
                pkgs=$(find . -type f -name 'blobfuse2*' \( -name '*.deb' -o -name '*.rpm' \) | sort)
                if [ -z "$pkgs" ]; then
                  echo "##vso[task.logissue type=error]No blobfuse2 packages found in the downloaded artifacts."
                  exit 1
                fi
                sha256sum $pkgs
                if grep -v -- '-2\.5\.6-' <<< "$pkgs"; then
                  echo "##vso[task.logissue type=error]The artifacts contain packages other than 2.5.6 (listed above)."
                  exit 1
                fi
                ls ./blobfuse2*fuse3.x86_64.rpm ./mariner/blobfuse2*fuse3.x86_64.rpm ./mariner/blobfuse2*fuse3.aarch64.rpm
              displayName: 'Verify signed packages are 2.5.6'
              workingDirectory: $(Build.ArtifactStagingDirectory)/blobfuse2-signed/

            - script: |
                blobfuseBinaryName=`ls blobfuse2-* | head -n 1`
                echo "Binary name: $blobfuseBinaryName"
                if [[ $blobfuseBinaryName == *"preview"* ]]; then
                  for f in ./blobfuse2-2*; do mv -v "$f" "${f/blobfuse2-/blobfuse2-preview-}" ; done
                fi
                ls -l 
              displayName: 'Rename preview binaries'
              workingDirectory: $(Build.ArtifactStagingDirectory)/blobfuse2-signed/

            - script: |
                cd mariner
                for f in ./blobfuse2*fuse3*.rpm; do mv -v "$f" "${f/-fuse3./-cm2.}"; done
                ls -lRt
                mv blobfuse2*.rpm ..
                cd ..
                rm -r mariner/
              displayName: 'Rename Mariner binaries'
              workingDirectory: $(Build.ArtifactStagingDirectory)/blobfuse2-signed/

            - script: |
                ls -lRt $(Build.ArtifactStagingDirectory)
              displayName: 'List Artifacts'

            - task: AzureCLI@2
              displayName: 'Upload packages'
              inputs:
                addSpnToEnvironment: true
                azureSubscription: 'WIF_MI_ESRP_V5'
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  pmc --auth-type wif --base-url "https://pmc-ingest.trafficmanager.net/api/v4" package upload blobfuse2-signed
                workingDirectory: $(Build.ArtifactStagingDirectory)/

            - script: |
                wget https://raw.githubusercontent.com/Azure/azure-storage-fuse/`echo $(Build.SourceBranch) | cut -d "/" -f 1,2 --complement`/setup/packages.csv -O packages.csv
                cat ./packages.csv
              displayName: 'Fetch packages.csv'
              workingDirectory: $(Build.ArtifactStagingDirectory)/

            - task: AzureCLI@2
              displayName: 'Add uploaded packages to repository'
              inputs:
                addSpnToEnvironment: true
                azureSubscription: 'WIF_MI_ESRP_V5'
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  fuse3AmdDeb=`pmc --auth-type wif --base-url "https://pmc-ingest.trafficmanager.net/api/v4" --id-only package upload blobfuse2*fuse3.x86_64.deb`
                  echo "Fuse3 AMD DEB ID: $fuse3AmdDeb"

                  fuse3ArmDeb=`pmc --auth-type wif --base-url "https://pmc-ingest.trafficmanager.net/api/v4" --id-only package upload blobfuse2*fuse3.arm64.deb`
                  echo "Fuse3 ARM DEB ID: $fuse3ArmDeb"

                  fuse3AmdRpm=`pmc --auth-type wif --base-url "https://pmc-ingest.trafficmanager.net/api/v4" --id-only package upload blobfuse2*fuse3.x86_64.rpm`
                  echo "Fuse3 AMD RPM ID: $fuse3AmdRpm"

                  fuse3ArmRpm=`pmc --auth-type wif --base-url "https://pmc-ingest.trafficmanager.net/api/v4" --id-only package upload blobfuse2*fuse3.aarch64.rpm`
                  echo "Fuse3 ARM RPM ID: $fuse3ArmRpm"

                  fuse2AmdDeb=`pmc --auth-type wif --base-url "https://pmc-ingest.trafficmanager.net/api/v4" --id-only package upload blobfuse2*fuse2.x86_64.deb`
                  echo "Fuse2 AMD DEB ID: $fuse2AmdDeb"

                  fuse2AmdRpm=`pmc --auth-type wif --base-url "https://pmc-ingest.trafficmanager.net/api/v4" --id-only package upload blobfuse2*fuse2.x86_64.rpm`
                  echo "Fuse2 AMD RPM ID: $fuse2AmdRpm"

                  fuse34AmdDeb=`pmc --auth-type wif --base-url "https://pmc-ingest.trafficmanager.net/api/v4" --id-only package upload blobfuse2*fuse3-4.x86_64.deb`
                  echo "Fuse3-4 AMD DEB ID: $fuse34AmdDeb"

                  fuse34ArmDeb=`pmc --auth-type wif --base-url "https://pmc-ingest.trafficmanager.net/api/v4" --id-only package upload blobfuse2*fuse3-4.arm64.deb`
                  echo "Fuse3-4 ARM DEB ID: $fuse34ArmDeb"

                  marinerAmdRpmFile=$(ls blobfuse2* | grep 'cm2\.x86_64\.rpm')
                  marinerFuse3AmdRpm=`pmc --auth-type wif --base-url "https://pmc-ingest.trafficmanager.net/api/v4" --id-only package upload blobfuse2*cm2.x86_64.rpm`
                  echo "Mariner fuse3 AMD RPM ID: $marinerFuse3AmdRpm"
                  echo "Mariner fuse3 AMD RPM $marinerAmdRpmFile"

                  marinerAarchRpmFile=$(ls blobfuse2* | grep 'cm2\.aarch64\.rpm')
                  marinerFuse3AarchRpm=`pmc --auth-type wif --base-url "https://pmc-ingest.trafficmanager.net/api/v4" --id-only package upload blobfuse2*cm2.aarch64.rpm`
                  echo "Mariner fuse3 ARM RPM ID: $marinerFuse3AarchRpm"
                  echo "Mariner fuse3 ARM RPM: $marinerAarchRpmFile"

                  is_preview="false"
                  echo "##vso[task.setvariable variable=is_preview]$is_preview"
                  if [[ $marinerAmdRpmFile == *"preview"* ]]; then
                    is_preview="true"
                    echo "##vso[task.setvariable variable=is_preview]$is_preview"
                  fi

                  while IFS=, read -r distro fuseArchType repoName releaseName; do

                    # If the package is preview, publish to mariner preview package
                    if [[ $distro == *"Mariner-"* ]]; then
                      if [ $is_preview = "true" ]; then
                        repoName=$(echo $repoName | sed 's/prod/preview/')
                      fi
                    fi

                    echo "Uploading packages for $distro"
                    pmc --auth-type wif --base-url "https://pmc-ingest.trafficmanager.net/api/v4" repo package update --add-packages ${!fuseArchType} $repoName $releaseName
                  done < <(tail -n +3 ../packages.csv)
                workingDirectory: $(Build.ArtifactStagingDirectory)/blobfuse2-signed/

            - task: AzureCLI@2
              displayName: 'Publish the repository'
              inputs:
                addSpnToEnvironment: true
                azureSubscription: 'WIF_MI_ESRP_V5'
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  while IFS=, read -r distro fuseArchType repoName releaseName; do
                    if [[ $fuseArchType == *"Arm"* ]]
                    then
                      echo "Skipping for ARM type on $distro"
                    else
                      if [[ $distro == *"Mariner-"* ]]; then
                          if [ "$(is_preview)" = "true" ]; then
                            repoName=$(echo $repoName | sed 's/prod/preview/')
                          fi
                      fi
                      echo "Repository Name: $repoName"

                      echo "Publishing for $distro"
                      pmc --auth-type wif --base-url "https://pmc-ingest.trafficmanager.net/api/v4" repo publish $repoName
                    fi
                  done < <(tail -n +3 ../packages.csv)
                workingDirectory: $(Build.ArtifactStagingDirectory)/blobfuse2-signed/

