logging:
  level: log_err
  file-path: "blobfuse2-benchmark.log"
  type: base

components:
  - libfuse
  - block_cache
  - attr_cache
  - azstorage

libfuse:
  ignore-open-flags: true
  max-fuse-threads: 256

block_cache:
  block-size-mb: 16
  mem-size-mb: 16384
  prefetch: 128
  parallelism: 128
  prefetch-on-open: true

attr_cache:
  timeout-sec: 7200

azstorage:
  mode: key
  container: { 0 }
  account-name: { AZURE_STORAGE_ACCOUNT }
  account-key: { AZURE_STORAGE_ACCESS_KEY }
